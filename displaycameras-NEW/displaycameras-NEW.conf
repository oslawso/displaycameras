# displaycameras-NEW Global Configuration
# Version: 1.0.0
#
# This file contains global settings that apply to all camera layouts.
# Layout-specific settings can be overridden in the layout.conf.* files.

#---------------------------------------------------------------------------
# Screen Blanking
#---------------------------------------------------------------------------
# Set to true to blank the screen with a black image before displaying feeds.
# Requires fbi package: apt-get install fbi
#blank=true

#---------------------------------------------------------------------------
# Network and Timing Settings
#---------------------------------------------------------------------------
# Network timeout for RTSP streams in seconds (default: 30)
# Increase if cameras are on a slow network or across WAN
mpv_timeout=30

# Seconds to wait after starting each camera before checking status (default: 3)
# Increase for slow cameras or networks
startsleep=3

# Seconds to wait after status check before checking playback position (default: 1)
feedsleep=1

# Maximum seconds to retry startup/playback checks (default: 5)
retry=5

#---------------------------------------------------------------------------
# Display Detection
#---------------------------------------------------------------------------
# Set to true to auto-detect display resolution and load matching layout.conf
# Requires disable_overscan=1 in /boot/config.txt for fbset method
#displaydetect=true

#---------------------------------------------------------------------------
# Camera Rotation
#---------------------------------------------------------------------------
# Set to true to enable automatic camera feed rotation
#rotate=true

# Seconds to display each feed before rotating (default: 5)
#rotatedelay=5

# Number of feeds to rotate per step (default: 1)
# Set to the number of on-screen windows for "screen flop" effect
#seq_step=1

#---------------------------------------------------------------------------
# Hardware Acceleration (NEW in displaycameras-NEW)
#---------------------------------------------------------------------------
# Hardware decoding mode: auto, v4l2m2m, vaapi, none (default: auto)
# 'auto' will use the best available method
hwdec=auto

# Enable low-latency profile for live streams (default: true)
# Reduces buffering for real-time feeds
low_latency=true
